<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> <!-- jQuery for simplicity -->
</head>
<body>
    <h1>Login</h1>
    
    <!-- Login Form -->
    <form id="login-form">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <button type="submit">Login</button>
    </form>

    <div id="error-message" style="color: red; display: none;">Invalid email or password</div>

    <script type="text/javascript">
        // Handle login form submission
        $("#login-form").on("submit", function(event) {
            event.preventDefault();  // Prevent form from submitting normally

            // Get email and password from the form
            const email = $("#email").val();
            const password = $("#password").val();

            // Validate input
            if (!email || !password) {
                alert("Please enter both email and password.");
                return;
            }

            // Prepare the data to send to the backend
            const loginData = {
                email: email,
                password: password
            };

            // Send the login request to the backend
            $.ajax({
                url: '/login',  // Your login endpoint
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(loginData),
                success: function(response) {
                    if (response.token) {
                        // Save the JWT token in localStorage
                        localStorage.setItem('token', response.token);

                        // Redirect to a protected page (e.g., dashboard)
                        window.location.href = "/dashboard";  // Change this to your desired page
                    } else {
                        // Show error message if token is not received
                        $("#error-message").text("Login failed. Please try again.").show();
                    }
                },
                error: function(error) {
                    console.log('Error during login:', error);
                    // Display error message
                    $("#error-message").text("Invalid email or password. Please try again.").show();
                }
            });
        });
    </script>
</body>
</html>
